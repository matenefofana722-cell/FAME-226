<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAME</title>
<style>
body{background:#080808;color:#E8D5A3;margin:0;font-family:serif;max-width:430px;margin:auto}
.logo{text-align:center;font-size:42px;letter-spacing:10px;padding:30px 0}
.tabs{display:flex;gap:8px;padding:0 16px}
.tab{flex:1;padding:12px;text-align:center;border:1px solid #222;border-radius:30px;background:#111;color:#666;font-size:12px}
.tab.active{background:#E8D5A3;color:#000;border-color:#E8D5A3}
.card{margin:20px 16px;background:#111;border-radius:16px;overflow:hidden;border:1px solid #1a1a1a}
.card img{width:100%;height:320px;object-fit:cover}
.card p{padding:12px;color:#888;font-size:13px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:auto;background:#080808;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;padding:14px 0}
.nav span{color:#444;font-size:10px}
.nav span.active{color:#E8D5A3}
</style>
</head>
<body>
<div class="logo">FAME</div>
<div class="tabs">
<div class="tab active">LIVE</div>
<div class="tab">CHAT</div>
<div class="tab">WALL</div>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=600">
<p><b style="color:#fff">noir.moda</b> London nights - fit check</p>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1529655683826-aba9b3e77383?w=600">
<p><b style="color:#fff">citylens_london</b> Southbank views</p>
</div>
<div style="height:80px"></div>
<div class="nav">
<span class="active">FEED</span><span>EXPLORE</span><span>+</span><span>INBOX</span><span>PROFILE</span>
</div>
</body>
</html>
