<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FAME</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08080c">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding-bottom:90px;overflow-x:hidden}
.top{padding:22px 0 14px;text-align:center;font-family:Georgia,serif;font-size:38px;letter-spacing:7px;color:#d8bc7a;font-weight:900}
.tabs{display:flex;gap:8px;padding:0 14px 16px}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:12px;border:1.2px solid #d8bc7a;background:#12121a;color:#d8bc7a;font-size:13px;font-weight:700}
.tabs button.active{background:#d8bc7a;color:#000}
.label{padding:0 16px 10px;color:#888;font-size:13px;letter-spacing:.3px}
.stories{display:flex;gap:14px;padding:0 14px 20px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.s{text-align:center;min-width:68px;font-size:11px;color:#9a9a9a}
.ring{width:64px;height:64px;border-radius:50%;border:2px solid #d8bc7a;padding:2.5px;margin:0 auto 6px;background:#15151f}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.you-wrap{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#f8c6c6,#e8a0a0);padding:2.5px;margin:0 auto 6px}
.you{width:100%;height:100%;border-radius:50%;background:#12121a;border:1.8px solid #d8bc7a;display:flex;align-items:center;justify-content:center;color:#d8bc7a;font-size:30px}
.feed{padding:0 12px;display:flex;flex-direction:column;gap:14px}
.card{background:#12121a;border-radius:18px;overflow:hidden;border:1px solid #1e1e2c}
.chead{display:flex;align-items:center;gap:10px;padding:11px 12px}
.chead img{width:36px;height:36px;border-radius:50%;border:1.6px solid #d8bc7a}
.chead .name{font-size:13px;font-weight:700}
.chead .meta{font-size:11px;color:#d8bc7a}
.cmedia{position:relative;background:#000;display:flex}
