<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAME</title><link rel="icon" href="icon-512.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#1e1e28;color:#fff;font-family:-apple-system,sans-serif;padding-bottom:85px}
.top{text-align:center;padding:22px 0 14px;font-size:38px;letter-spacing:7px;color:#e6c78a;font-weight:900}
.label{padding:8px 16px 10px;color:#888;font-size:13px}.stories{display:flex;gap:14px;padding:0 14px 20px;overflow:auto}.stories::-webkit-scrollbar{display:none}
.s{text-align:center;min-width:68px;font-size:11px;color:#bbb;cursor:pointer}.s div{width:64px;height:64px;border-radius:50%;border:2px solid #e6c78a;padding:2.5px;margin:0 auto 4px}.s img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.feed{padding:0 12px;display:flex;flex-direction:column;gap:14px}.card{background:#2a2a36;border-radius:18px;overflow:hidden;border:1px solid #3a3a4a}
.chead{display:flex;align-items:center;gap:10px;padding:11px 12px}.chead img{width:36px;height:36px;border-radius:50%;border:1.6px solid #e6c78a}
.cmedia{position:relative;display:block;background:#000}.main-img{width:100%;height:520px;object-fit:cover;display:block}
.act{cursor:pointer;text-align:center;user-select:none;transition:.15s;display:flex;align-items:center;gap:4px;padding:8px 10px}
.act svg{width:22px;height:22px;stroke:#e6c78a;fill:none;stroke-width:1.6}.act.liked svg{fill:#e6c78a;stroke:#e6c78a}
.act b{font-size:11px;color:#e6c78a;font-weight:700}.cap{padding:10px 12px;font-size:12.5px;color:#ddd}
.page{display:none}.page.active{display:block}.page.active.feed{display:flex;flex-direction:column}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1e1e28;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0 18px;z-index:100}
.nav button{background:none;border:none;color:#666;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}.nav button.active{color:#e6c78a}
#createModal{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:none;place-items:center;padding:20px}
.box{background:#2a2a36;border-radius:18px;padding:18px;width:100%;max-width:380px}
</style></head><body>
<div class="top">FAME</div>

<div id="pLive" class="page"><div class="label">🔴 Live Now</div><div style="padding:20px;color:#666">Live drops coming soon</div></div>

<div id="feed" class="page active feed"><div class="label">London nights ✨</div>
<div class="stories">
<div class="s" onclick="alert('Your Story')"><div><img src="https://i.pravatar.cc/300?img=1"></div>Your Story</div>
<div class="s"><div><img src="https://i.pravatar.cc/300?img=5"></div>amelia._</div>
<div class="s"><div><img src="https://i.pravatar.cc/300?img=12"></div>jordan.k</div>
</div>
<div id="feedList" class="feed"></div>
</div>

<div id="explorer" class="page"><div class="label">🔍 Explorer</div><div id="exploreGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;padding:2px"></div></div>
<div id="inbox" class="page"><div class="label">📩 Inbox</div><div style="padding:16px;border-bottom:1px solid #222"><b>fame_official</b><br><span style="color:#666;font-size:13px">Welcome to FAME V2 🚀</span></div></div>
<div id="profile" class="page"><div class="label">👤 Profile</div><div style="text-align:center;padding:30px"><div style="width:80px;height:80px;border-radius:50%;background:#e6c78a;margin:0 auto 12px"></div><b>Matene F.</b><p id="uid" style="color:#888;font-size:12px;margin-top:6px"></p><p style="color:#666;font-size:13px">19 • NW10 • 8.7K followers</p></div><div id="profileGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;padding:2px"></div></div>

<div class="nav">
<button id="btn-pLive" onclick="showPage('pLive')">⌂<br>Live</button>
<button id="btn-feed" class="active" onclick="showPage('feed')">⌂<br>Feed</button>
<button id="btn-explorer" onclick="showPage('explorer')">◎<br>Explorer</button>
<button id="btn-create" onclick="openCreate()">+<br>Create</button>
<button id="btn-inbox" onclick="showPage('inbox')">✉<br>Inbox</button>
<button id="btn-profile" onclick="showPage('profile')">○<br>Profile</button>
</div>

<div id="createModal"><div class="box"><h3>Create ✨</h3><input type="file" id="fileInput" accept="image/*,video/*" style="width:100%;background:#1e1e28;color:#fff;padding:10px;border-radius:10px;border:1px solid #333;margin-top:10px"><textarea id="caption" placeholder="London nights #fame" style="width:100%;background:#1e1e28;color:#fff;border:1px solid #333;padding:10px;border-radius:10px;margin-top:10px;min-height:70px"></textarea><button onclick="createPost()" style="width:100%;background:#e6c78a;color:#000;border:none;padding:12px;border-radius:12px;font-weight:900;margin-top:12px">POST 🚀</button><button onclick="closeCreate()" style="width:100%;background:none;border:none;color:#666;padding:10px;margin-top:6px">Cancel</button><p id="status" style="color:#e6c78a;text-align:center;margin-top:8px;font-size:12px"></p></div></div>

<script>
// === BUTTONS FIRST - NO CRASH ===
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>{p.classList.remove('active'); p.style.display='none'});
  let t=document.getElementById(name); if(t){t.classList.add('active'); t.style.display=name==='feed'?'flex':'block'}
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  let b=document.getElementById('btn-'+name); if(b) b.classList.add('active');
}
function openCreate(){document.getElementById('createModal').style.display='grid'}
function closeCreate(){document.getElementById('createModal').style.display='none'}
document.getElementById('uid').innerText='fame_'+Math.random().toString(36).slice(2,7);

// === SAFE SUPABASE ===
const SUPA_URL='https://YOUR_PROJECT_ID.supabase.co'; // REPLACE
const SUPA_KEY='sb_publishable_YOUR_KEY'; // REPLACE
let supa=null;
try{ if(!SUPA_URL.includes('YOUR_PROJECT')) supa=supabase.createClient(SUPA_URL,SUPA_KEY); }catch(e){}

async function loadFeed(){
  let list=document.getElementById('feedList');
  try{
    if(!supa) throw 'no supa';
    let {data}=await supa.from('posts').select('*').order('created_at',{ascending:false}).limit(20);
    if(!data||!data.length) throw 'empty';
    list.innerHTML=''; data.forEach(p=>{
      let isV=p.video_url.includes('.mp4');
      list.innerHTML+=`<div class="card"><div class="chead"><img src="https://i.pravatar.cc/150?img=5"><div><div style="font-size:13px;font-weight:700">${p.username||'citylens_london'}</div><div style="font-size:11px;color:#888">34m ago</div></div></div><div class="cmedia">${isV?`<video src="${p.video_url}" controls style="width:100%;height:520px;object-fit:cover"></video>`:`<img class="main-img" src="${p.video_url}">`}</div><div style="display:flex;gap:6px;padding:4px 6px"><div class="act" onclick="like(this)"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-4.35-8.5-7.5A4.5 4.5 0 0 1 12 8a4.5 4.5 0 0 1 8.5 5.5C18.5 16.65 12 21 12 21z"></path></svg><b>${p.likes||'8.7K'}</b></div><div class="act"><b>💬 291</b></div></div><div class="cap">${p.caption||'London nights ✨'}</div></div>`;
    });
    document.getElementById('exploreGrid').innerHTML=list.innerHTML;
  }catch(e){
    list.innerHTML=`<div class="card"><div class="chead"><img src="https://i.pravatar.cc/150?img=5"><div><div style="font-size:13px;font-weight:700">citylens_london</div><div style="font-size:11px;color:#888">34m ago • Add REAL Supabase keys to see real posts</div></div></div><img class="main-img" src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=700"><div class="cap">London nights ✨ fit check #fame #night #style — Replace YOUR_PROJECT_ID with real keys!</div></div>`;
  }
}
async function createPost(){
  let f=fileInput.files[0], s=status; if(!f){s.innerText='Pick file!';return}
  if(!supa){alert('Put REAL Supabase keys first!');return}
  s.innerText='Uploading...'; try{
    let n=Date.now()+'_'+f.name.replace(/\s/g,'_'); let {error:up}=await supa.storage.from('videos').upload(n,f); if(up)throw up;
    let {data}=supa.storage.from('videos').getPublicUrl(n);
    let {error:db}=await supa.from('posts').insert([{video_url:data.publicUrl,caption:caption.value,username:'citylens_london'}]); if(db)throw db;
    s.innerText='Posted! 🔥'; setTimeout(()=>{closeCreate();loadFeed();showPage('feed')},900)
  }catch(e){s.innerText=e.message}
}
function like(el){ el.classList.toggle('liked'); }
loadFeed();
</script></body></html>
