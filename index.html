<script type="module">
import { uploadFameVideo, getFameFeed } from './supabase.js'

window.showPage = (id, btn) => {
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
 document.getElementById(id).classList.add('active')
 document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'))
 if(btn) btn.classList.add('active')
}

async function loadFeed(){
 const videos = await getFameFeed()
 const box = document.getElementById('feedVideos')
 if(!videos.length){ box.innerHTML='<p style="color:#666">No videos yet - be first 🔥</p>'; return }
 box.innerHTML = videos.map(v=>`
  <div style="background:#111;margin:12px 0;border-radius:12px;overflow:hidden">
   <video src="${v.url}" controls style="width:100%"></video>
   <div style="padding:10px;text-align:left"><b>@${v.username}</b><br>${v.caption||''}</div>
  </div>`).join('')
}
loadFeed()

window.handleUpload = async () => {
 const file = document.getElementById('videoFile').files[0]
 const caption = document.getElementById('caption').value
 if(!file) return alert('Pick video')
 document.getElementById('uploadStatus').innerText='Uploading...'
 try{
  await uploadFameVideo(file, caption)
  document.getElementById('uploadStatus').innerText='Posted! 🔥'
  setTimeout(()=>{document.getElementById('uploadModal').style.display='none';location.reload()},1000)
 }catch(e){document.getElementById('uploadStatus').innerText='Failed: '+e.message}
}
</script>
