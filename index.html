<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FAME</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#fff;font-family:'Inter',sans-serif;max-width:430px;margin:0 auto;overflow-x:hidden}
.logo{font-family:'Cormorant Garamond',serif;font-size:38px;letter-spacing:12px;color:#E8D5A3;text-align:center;padding:22px 0 12px;font-weight:600}
.stories{display:flex;gap:14px;padding:0 16px 16px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{text-align:center;min-width:62px}
.ring{width:62px;height:62px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#E8D5A3,#C9A86A);margin-bottom:6px}
.ring.you{background:#1a1a1a;border:1px dashed #333}
.inner{width:100%;height:100%;border-radius:50%;background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center}
.inner img{width:100%;height:100%;object-fit:cover}
.plus{font-size:22px;color:#E8D5A3}
.sname{font-size:10px;color:#777;letter-spacing:0.5px}
.tabs{display:flex;gap:8px;padding:4px 16px 14px}
.tab{flex:1;padding:11px;text-align:center;border-radius:24px;font-size:11px;letter-spacing:1.5px;border:1px solid #1e1e1e;background:#111;color:#555;transition:0.2s}
.tab.active{background:#E8D5A3;color:#080808;border-color:#E8D5A3;font-weight:500}
.feed{padding:0 12px 90px}
.card{position:relative;background:#111;border-radius:18px;overflow:hidden;margin-bottom:16px;border:1px solid #1a1a1a}
.card-media{position:relative;height:520px;background:#000}
.card-media img{width:100%;height:100%;object-fit:cover}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,0.45);backdrop-filter:blur(8px);border:1px solid rgba(232,213,163,0.3);display:flex;align-items:center;justify-content:center}
.side{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:18px;align-items:center}
.action{display:flex;flex-direction:column;align-items:center;gap:5px}
.icon{width:34px;height:34px;border-radius:50%;background:rgba(15,15,15,0.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center}
.action span{font-size:11px;color:#fff;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,0.8)}
.bottom-info{position:absolute;bottom:0;left:0;right:50px;padding:14px 16px;background:linear-gradient(transparent,rgba(0,0,0,0.9))}
.user{font-size:13px;font-weight:600;margin-bottom:3px}
.caption{font-size:12px;color:#aaa;line-height:1.3}
.caption b{color:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:#080808;border-top:1px solid #151515;display:flex;justify-content:space-around;padding:10px 0 20px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:#3a3a3a}
.nav-item.active{color:#E8D5A3}
.nav-item svg{width:22px;height:22px;stroke-width:1.5}
.nav-label{font-size:9px;letter-spacing:1px}
</style>
</head>
<body>
<div class="logo">FAME</div>

<div class="stories">
<div class="story"><div class="ring you"><div class="inner"><span class="plus">+</span></div></div><div class="sname">You</div></div>
<div class="story"><div class="ring"><div class="inner"><img src="https://i.pravatar.cc/100?img=5"></div></div><div class="sname">amelia._</div></div>
<div class="story"><div class="ring"><div class="inner"><img src="https://i.pravatar.cc/100?img=8"></div></div><div class="sname">jordan.k</div></div>
<div class="story"><div class="ring"><div class="inner"><img src="https://i.pravatar.cc/100?img=12"></div></div><div class="sname">noir.moda</div></div>
<div class="story"><div class="ring"><div class="inner"><img src="https://i.pravatar.cc/100?img=32"></div></div><div class="sname">citylens</div></div>
</div>

<div class="tabs"><div class="tab active">LIVE</div><div class="tab">CHAT</div><div class="tab">WALL</div></div>
