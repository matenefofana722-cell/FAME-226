<!DOCTYPE html>
<html>
<head><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPA_URL='https://oxrwfvccrvbnpernnowr.supabase.co';const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94cndmdmNjcnZibnBlcm5ub3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODkzNzEsImV4cCI6MjEwNjQ2NTM3MX0.Io2_xEx6RoQRrYvEmzXvRRMcsQkoe7POnOAJ17fDS0E';const supa=supabase.createClient(SUPA_URL,SUPA_KEY);</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAME</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding-bottom:80px}
header{padding:12px;text-align:center;font-weight:800;font-size:22px;border-bottom:1px solid #222}
.post{border-bottom:1px solid #222;padding:10px}
video{width:100%;border-radius:12px;background:#111}
.btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#d6c08b;color:#000;padding:14px 28px;border-radius:30px;font-weight:700;border:none}
#create{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:10}
#createBox{background:#1a1a1a;padding:20px;border-radius:16px;width:90%;max-width:400px}
input,textarea{width:100%;background:#222;border:none;color:#fff;padding:10px;border-radius:8px;margin:6px 0}
</style>
</head>
<body>
<header>FAME-226</header>
<div id="feed"></div>
<button class="btn" onclick="document.getElementById('create').style.display='flex'">+ Create New</button>

<div id="create"><div id="createBox">
<h3>Create New</h3>
<input type="file" id="vFile" accept="video/*">
<input id="caption" placeholder="Caption">
<input id="loc" placeholder="Location London">
<div style="display:flex;gap:10px;margin-top:10px">
<button onclick="document.getElementById('create').style.display='none'" style="flex:1;padding:10px;border-radius:20px;border:none;background:#333;color:#fff">Cancel</button>
<button onclick="doPost()" id="postBtn" style="flex:1;padding:10px;border-radius:20px;border:none;background:#d6c08b;font-weight:700">Post</button>
</div>
</div></div>

<script>
async function load(){
 let {data} = await supa.from('posts').select('*').order('created_at',{ascending:false});
 feed.innerHTML='';
 (data||[]).forEach(p=>{
   feed.innerHTML+=`<div class="post"><video src="${p.video_url}" controls playsinline></video><div style="padding:8px"><b>${p.caption||''}</b><br><small>${p.location||''}</small></div></div>`;
 });
}
async function doPost(){
 let f=vFile.files[0]; if(!f) return alert('Pick video');
 postBtn.innerText='Uploading...';
 let name=Date.now()+'_'+f.name;
 let {error:upErr}=await supa.storage.from('videos').upload(name,f);
 if(upErr) return alert(upErr.message);
 let {data}=supa.storage.from('videos').getPublicUrl(name);
 await supa.from('posts').insert({video_url:data.publicUrl,caption:caption.value,location:loc.value});
 document.getElementById('create').style.display='none';
 postBtn.innerText='Post';
 load();
}
load();
</script>
</body>
</html>
